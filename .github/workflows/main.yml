
name: Build Cyber Technician APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android Project      - name: Verify Android Gradle Config
        run: |
          echo "=== Extracted project files ==="
          find extracted -name build.gradle -o -name build.gradle.kts
          echo "=== NDK configuration ==="
          grep -n -A 8 -B 5 "abiFilters" extracted/app/build.gradle
        run: |
          unzip -o CT-Android-Project.zip -d extracted
          find extracted \( -name settings.gradle -o -name settings.gradle.kts \)
          find extracted -name gradlew

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Technician-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
