
name: Build Cyber Technician APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android Project
        run: |
          unzip -o CT-Android-Project-Android-Services-Added.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      
      - name: Fix Chaquopy NDK Configuration
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "abiFilters" not in s:
              marker = "defaultConfig {"
              if marker not in s:
                  raise SystemExit("defaultConfig block not found")

              s = s.replace(
                  marker,
                  marker + "\n        ndk {\n            abiFilters 'arm64-v8a'\n        }",
                  1
              )
              p.write_text(s)

          print(p.read_text())
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

          echo 

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Technician-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
